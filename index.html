<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carrasquilla Aprende</title>
<style>
:root{--rojo:#a50912;--rojo2:#7c0710;--negro:#171717;--gris:#f3f4f6;--borde:#ddd;--blanco:#fff;--verde:#177245}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#222;background:var(--gris)}button,select{font:inherit}.banner{width:100%;background:#fff;border-bottom:7px solid var(--rojo);overflow:hidden}.banner img{display:block;width:100%;height:auto;aspect-ratio:3/1;object-fit:contain}.contenedor{max-width:1180px;margin:28px auto;padding:0 18px}.bienvenida,.panel,.estado{background:#fff;border-radius:14px;box-shadow:0 5px 20px #00000012}.bienvenida{padding:22px;border-left:6px solid var(--rojo)}.bienvenida h2{margin:0 0 8px}.panel{padding:22px;margin-top:20px}.filtros{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px}.campo label{display:block;font-size:.84rem;font-weight:800;margin-bottom:6px;color:#444}.campo select{width:100%;padding:11px;border:1px solid #bbb;border-radius:9px;background:#fff}.campo select:focus{outline:3px solid #a5091233;border-color:var(--rojo)}.acciones{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}.boton{border:0;border-radius:9px;padding:10px 16px;cursor:pointer;font-weight:800}.primario{background:var(--rojo);color:#fff}.primario:hover{background:var(--rojo2)}.secundario{background:#ececec;color:#222}.estado{margin:18px 0;padding:15px 18px;display:flex;align-items:center;gap:12px;border:1px solid #ddd}.estado[hidden]{display:none}.estado.cargando{border-left:5px solid #b7791f}.estado.exito{border-left:5px solid var(--verde)}.estado.error{border-left:5px solid var(--rojo);background:#fff8f8}.spinner{width:18px;height:18px;border:3px solid #ddd;border-top-color:var(--rojo);border-radius:50%;animation:giro .8s linear infinite}@keyframes giro{to{transform:rotate(360deg)}}.resumen{display:flex;justify-content:space-between;gap:10px;align-items:end;margin:24px 0 12px}.resumen h2{margin:0}.guias{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.guia{background:#fff;border-radius:13px;padding:18px;border-top:5px solid var(--rojo);box-shadow:0 4px 16px #00000010;display:flex;flex-direction:column}.etiquetas{display:flex;gap:7px;flex-wrap:wrap}.etiqueta{font-size:.75rem;font-weight:800;background:#f2e3e5;color:var(--rojo2);padding:4px 8px;border-radius:999px}.guia h3{margin:13px 0 5px}.codigo{font-weight:800;color:#555}.meta{font-size:.9rem;color:#666;margin:8px 0 16px}.guia a{margin-top:auto;text-align:center;text-decoration:none}.vacio{grid-column:1/-1;text-align:center;background:#fff;border:1px dashed #bbb;border-radius:13px;padding:36px;color:#555}footer{margin-top:35px;background:#171717;color:#ddd;text-align:center;padding:22px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:760px){.filtros{grid-template-columns:1fr 1fr}}@media(max-width:460px){.filtros{grid-template-columns:1fr}.banner img{min-height:150px}}
</style>
</head>
<body>
<header class="banner"><img src="assets/banner-carrasquilla-aprende-en-casa.png" alt="Colegio Carrasquilla Aprende en Casa. Guías y recursos para el trabajo académico desde casa."></header>
<main class="contenedor"><section class="bienvenida"><h2>Consulta tus guías de aprendizaje</h2><p>Selecciona tu nivel, grado, curso y asignatura. Solo se muestran las guías autorizadas para publicación.</p></section>
<section class="panel" aria-labelledby="tituloFiltros"><h2 id="tituloFiltros">Buscar guías</h2><div class="filtros">
<div class="campo"><label for="nivel">Nivel</label><select id="nivel" disabled><option value="">Todos los niveles</option></select></div>
<div class="campo"><label for="grado">Grado o ciclo</label><select id="grado" disabled><option value="">Todos los grados</option></select></div>
<div class="campo"><label for="curso">Curso</label><select id="curso" disabled><option value="">Todos los cursos</option></select></div>
<div class="campo"><label for="asignatura">Asignatura</label><select id="asignatura" disabled><option value="">Todas las asignaturas</option></select></div>
</div><div class="acciones"><button class="boton secundario" id="limpiar" type="button" disabled>Limpiar filtros</button><button class="boton primario" id="reintentar" type="button" hidden>Reintentar carga</button></div></section>
<div id="estado" class="estado cargando" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span>Cargando guías disponibles…</span></div>
<section aria-labelledby="tituloGuias"><div class="resumen"><div><h2 id="tituloGuias">Guías disponibles</h2><span id="conteo">Preparando consulta…</span></div></div><div id="guias" class="guias"></div></section></main>
<footer>Institución Educativa Carrasquilla Industrial · Portal de apoyo académico</footer>
<script>
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vR6_226wYMAKgauEj6-xQCmPS0vOtIsVnS1VbAU2pWmkP5lZQUeAu_0pXWqk0Uh-pEB3ksnGSiFVNkS/pub?gid=1567009210&single=true&output=csv";
const CAMPOS=["NIVEL","GRADO","CURSO","ID_ASIGNATURA","ASIGNATURA","CODIGO","TITULO","TIPO_GUIA","FECHA","URL"];let GUIAS=[];
const $=id=>document.getElementById(id), selects=[$("nivel"),$("grado"),$("curso"),$("asignatura")];
function parseCSV(texto){const filas=[];let fila=[],valor="",comillas=false;texto=texto.replace(/^\uFEFF/,"");for(let i=0;i<texto.length;i++){const c=texto[i],n=texto[i+1];if(c==='"'){if(comillas&&n==='"'){valor+='"';i++}else comillas=!comillas}else if(c===","&&!comillas){fila.push(valor);valor=""}else if((c==="\n"||c==="\r")&&!comillas){if(c==="\r"&&n==="\n")i++;fila.push(valor);if(fila.some(x=>x.trim()))filas.push(fila);fila=[];valor=""}else valor+=c}if(valor||fila.length){fila.push(valor);if(fila.some(x=>x.trim()))filas.push(fila)}return filas}
function normalizarEncabezado(v){return v.trim().toUpperCase().replace(/\s+/g,"_")}
function convertirCSV(texto){const filas=parseCSV(texto);if(!filas.length)throw new Error("La hoja publicada está vacía.");const encabezados=filas[0].map(normalizarEncabezado);const faltantes=CAMPOS.filter(c=>!encabezados.includes(c));if(faltantes.length)throw new Error("Faltan columnas requeridas: "+faltantes.join(", "));return filas.slice(1).map(f=>Object.fromEntries(CAMPOS.map(c=>[c,(f[encabezados.indexOf(c)]||"").trim()]))).filter(g=>g.CODIGO&&g.TITULO&&g.URL)}
function opciones(select,valores,texto){const actual=select.value;select.replaceChildren(new Option(texto,""),...valores.map(v=>new Option(v,v)));if(valores.includes(actual))select.value=actual}
function unicos(arr){return [...new Set(arr.filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es",{numeric:true,sensitivity:"base"}))}
function actualizarFiltros(origen){let base=GUIAS;if(origen==="nivel"){ $("grado").value="";$("curso").value="";$("asignatura").value="" }if(origen==="grado"){ $("curso").value="";$("asignatura").value="" }if(origen==="curso")$("asignatura").value="";if($("nivel").value)base=base.filter(g=>g.NIVEL===$("nivel").value);opciones($("grado"),unicos(base.map(g=>g.GRADO)),"Todos los grados");if($("grado").value)base=base.filter(g=>g.GRADO===$("grado").value);opciones($("curso"),unicos(base.map(g=>g.CURSO)),"Todos los cursos");if($("curso").value)base=base.filter(g=>g.CURSO===$("curso").value);opciones($("asignatura"),unicos(base.map(g=>g.ASIGNATURA)),"Todas las asignaturas");renderizar()}
function escapar(v){return v.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function urlSegura(v){try{const u=new URL(v);return ["http:","https:"].includes(u.protocol)?u.href:""}catch{return ""}}
function renderizar(){const f={NIVEL:$("nivel").value,GRADO:$("grado").value,CURSO:$("curso").value,ASIGNATURA:$("asignatura").value};const lista=GUIAS.filter(g=>Object.entries(f).every(([k,v])=>!v||g[k]===v));$("conteo").textContent=lista.length===1?"1 guía encontrada":`${lista.length} guías encontradas`;$("guias").innerHTML=lista.length?lista.map(g=>`<article class="guia"><div class="etiquetas"><span class="etiqueta">${escapar(g.NIVEL)}</span><span class="etiqueta">${escapar(g.GRADO)} · ${escapar(g.CURSO)}</span><span class="etiqueta">${escapar(g.TIPO_GUIA)}</span></div><h3>${escapar(g.TITULO)}</h3><div class="codigo">${escapar(g.CODIGO)}</div><div class="meta">${escapar(g.ASIGNATURA)}${g.FECHA?` · ${escapar(g.FECHA)}`:""}</div><a class="boton primario" href="${escapar(urlSegura(g.URL))}" target="_blank" rel="noopener noreferrer">Abrir guía</a></article>`).join(""):'<div class="vacio"><strong>No hay guías para esta selección.</strong><br>Prueba cambiando o limpiando los filtros.</div>'}
function estado(tipo,mensaje){const e=$("estado");e.className="estado "+tipo;e.hidden=false;e.innerHTML=(tipo==="cargando"?'<span class="spinner" aria-hidden="true"></span>':"")+`<span>${escapar(mensaje)}</span>`}
async function cargar(){estado("cargando","Cargando guías disponibles…");$("reintentar").hidden=true;selects.forEach(s=>s.disabled=true);$("limpiar").disabled=true;try{const r=await fetch(CSV_URL,{cache:"no-store"});if(!r.ok)throw new Error(`La fuente respondió con estado ${r.status}.`);GUIAS=convertirCSV(await r.text());opciones($("nivel"),unicos(GUIAS.map(g=>g.NIVEL)),"Todos los niveles");actualizarFiltros();selects.forEach(s=>s.disabled=false);$("limpiar").disabled=false;estado("exito",`${GUIAS.length} ${GUIAS.length===1?"guía disponible":"guías disponibles"}. Datos actualizados desde la hoja institucional.`);setTimeout(()=>{$("estado").hidden=true},5000)}catch(error){console.error(error);GUIAS=[];$("conteo").textContent="No fue posible consultar las guías";$("guias").innerHTML='<div class="vacio"><strong>Las guías no están disponibles en este momento.</strong><br>Comprueba tu conexión y vuelve a intentarlo.</div>';estado("error","No se pudieron cargar las guías. "+error.message);$("reintentar").hidden=false}}
selects.forEach(s=>s.addEventListener("change",()=>actualizarFiltros(s.id)));$("limpiar").addEventListener("click",()=>{selects.forEach(s=>s.value="");actualizarFiltros("nivel")});$("reintentar").addEventListener("click",cargar);cargar();
</script></body></html>
